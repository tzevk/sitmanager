<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>SIT Facescan Relay</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, Segoe UI, Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 20px;
    }
    h1 { font-size: 15px; margin: 0 0 4px; color: #f8fafc; }
    .source { font-size: 12px; color: #94a3b8; margin-bottom: 16px; }
    .status {
      font-size: 13px;
      padding: 10px 12px;
      border-radius: 6px;
      background: #1e293b;
      min-height: 40px;
      word-break: break-word;
    }
    .status.ok { border-left: 3px solid #22c55e; }
    .status.err { border-left: 3px solid #ef4444; }
    .meta { font-size: 11px; color: #64748b; margin-top: 8px; }
    button {
      margin-top: 14px;
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    button:disabled { background: #334155; cursor: default; }
  </style>
</head>
<body>
  <h1>SIT Facescan Relay</h1>
  <div class="source" id="source">Loading…</div>
  <div class="status" id="status">Starting…</div>
  <div class="meta" id="meta"></div>
  <button id="sync-btn">Sync Now</button>
  <script src="renderer.js"></script>
</body>
</html>
